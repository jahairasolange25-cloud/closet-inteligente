# Secret Scanning Rules — Closet Inteligente
# These patterns are checked by trufflehog and custom secret scanners.

rules:
  - id: jwt-secret-hardcoded
    pattern:
      - '(?i)JWT_SECRET\s*=.*["\x27]?(?:your|change_me|dev-|staging-|test)'
      - '(?i)JWT_REFRESH_SECRET\s*=.*["\x27]?(?:your|change_me|dev-|staging-|test)'
    level: high
    message: "JWT secrets use weak/placeholder values"

  - id: cloudinary-credentials
    pattern:
      - 'CLOUDINARY_API_KEY\s*=\s*\d{6,}'
      - 'CLOUDINARY_API_SECRET\s*='
    level: critical
    message: "Cloudinary credentials exposed"

  - id: database-connection-string
    pattern:
      - 'postgresql://[^:]+:[^@]+@'
      - 'DATABASE_URL\s*=.*://[^:]+:[^@]+@'
    level: critical
    message: "Database connection string with password"

  - id: private-key
    pattern:
      - '-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'
      - '-----BEGIN OPENSSH PRIVATE KEY-----'
    level: critical
    message: "Private key file detected"

  - id: supabase-keys
    pattern:
      - 'SUPABASE_(?:ANON|SERVICE_ROLE)_KEY\s*='
    level: critical
    message: "Supabase API keys exposed"

  - id: redis-password
    pattern:
      - 'REDIS_PASSWORD\s*=\s*["\x27]?[^"\x27\n\s]{8,}["\x27]?'
    level: high
    message: "Redis password may be exposed"

  - id: aws-credentials
    pattern:
      - 'AKIA[0-9A-Z]{16}'
      - '(?i)aws_access_key_id\s*='
      - '(?i)aws_secret_access_key\s*='
    level: critical
    message: "AWS credentials detected"

  - id: generic-api-key
    pattern:
      - '(?i)(?:api[_-]?key|apikey|secret[_-]?key)\s*[=:]\s*["\x27][A-Za-z0-9+/=]{20,}["\x27]'
    level: high
    message: "Potential API key exposed"
