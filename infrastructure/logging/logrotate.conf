# ============================================================
# CLOSET INTELIGENTE — Log Rotation for Docker Containers
# ============================================================
# Place this file at /etc/logrotate.d/closet on the host.
# For Docker json-file driver, logs are managed by Docker
# daemon.json settings. This config covers application logs
# written to volume mounts.
#
# Test: logrotate -d /etc/logrotate.d/closet
# Force: logrotate -f /etc/logrotate.d/closet
# ============================================================

# --- Backend application logs (if file-logging is enabled) ---
/var/log/closet/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 30
  maxsize 100M
  create 0640 appuser appuser
  postrotate
    # Signal the app to reopen log files (if using log file watcher)
    # kill -USR1 $(cat /var/run/closet-backend.pid 2>/dev/null) 2>/dev/null || true
  endscript
}

# --- AI service logs ---
/var/log/closet-ai/*.log {
  daily
  rotate 14
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 14
  maxsize 50M
  create 0640 appuser appuser
}

# --- PostgreSQL slow query / error logs (if custom logging) ---
/var/log/postgresql/*.log {
  weekly
  rotate 12
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 84
  maxsize 200M
  create 0640 postgres postgres
}

# --- Nginx / reverse proxy logs (if present) ---
/var/log/nginx/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 30
  maxsize 100M
  create 0640 www-data adm
  sharedscripts
  postrotate
    [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
  endscript
}

# --- Audit logs (JSONL files from AuditLogInterceptor) ---
/var/log/closet/audit-*.jsonl {
  daily
  rotate 90
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 90
  maxsize 500M
  create 0640 appuser appuser
}

# --- Docker container logs (if using json-file driver) ---
# Managed via daemon.json instead of logrotate for json-file driver:
# {
#   "log-driver": "json-file",
#   "log-opts": {
#     "max-size": "10m",
#     "max-file": "3"
#   }
# }
