# Redis configuration for Closet Inteligente
# Production-safe defaults with persistence enabled

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence: AOF (Append-Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a secondary backup
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory management
maxmemory-policy allkeys-lru

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in production
# (Uncomment if running in production with known clients)
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""

# Timeout (0 = disabled for persistent connections)
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
