global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "closet-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["closet-staging-backend:4000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "closet-backend"

  - job_name: "closet-ai"
    metrics_path: /health
    static_configs:
      - targets: ["closet-staging-ai:5100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "closet-ai"

  - job_name: "nginx"
    static_configs:
      - targets: ["closet-staging-nginx:80"]
    metrics_path: /health
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "closet-nginx"

  - job_name: "postgres"
    static_configs:
      - targets: ["closet-staging-postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["closet-staging-redis:6379"]
