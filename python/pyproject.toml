[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "closet-ai"
version = "0.1.0"
description = "Closet Inteligente Digital — AI/CV Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=11.0.0",
    "rembg[cpu]>=0.4.0",
    "numpy>=2.1.0",
    "structlog>=25.1.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "psutil>=6.1.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
]
ml = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "transformers>=4.40.0",
    "open-clip-torch>=2.24.0",
]
llm = [
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
