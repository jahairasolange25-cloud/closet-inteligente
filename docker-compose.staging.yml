# ============================================================
# CLOSET INTELIGENTE — STAGING / PRODUCTION-SIMULATION
# ============================================================
# This file mimics production behavior:
#   - Production Dockerfiles (multi-stage, non-root)
#   - Nginx reverse proxy with gzip/brotli, WS proxy, upload limits
#   - Healthchecks for ALL services
#   - Dependency ordering via condition: service_healthy
#   - Named volumes with log persistence
#   - Production-grade restart policies, memory & CPU limits
#   - Prometheus + Grafana for observability
#   - OpenTelemetry collector for distributed traces
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &restart-policy
  restart: unless-stopped

x-resources-backend: &resources-backend
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

x-resources-ai: &resources-ai
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "1.0"
      reservations:
        memory: 512M
        cpus: "0.5"

x-resources-db: &resources-db
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

x-resources-cache: &resources-cache
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.25"
      reservations:
        memory: 128M
        cpus: "0.1"

x-resources-web: &resources-web
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.25"
      reservations:
        memory: 128M
        cpus: "0.1"

networks:
  closet-network:
    name: closet-staging-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  closet-pgdata:
    name: closet-staging-pgdata
    driver: local
  closet-redisdata:
    name: closet-staging-redisdata
    driver: local
  closet-shared-uploads:
    name: closet-staging-shared-uploads
    driver: local
  closet-logs:
    name: closet-staging-logs
    driver: local
  closet-grafana-data:
    name: closet-staging-grafana-data
    driver: local
  closet-prometheus-data:
    name: closet-staging-prometheus-data
    driver: local

services:

  # ──────────────────────────────────────────────────────
  # POSTGRESQL
  # ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: closet-staging-postgres
    <<: *restart-policy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closet_staging}
      POSTGRES_USER: ${POSTGRES_USER:-closet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closet_staging_secret}
      TZ: ${TZ:-UTC}
    volumes:
      - closet-pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - closet-logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-closet} -d ${POSTGRES_DB:-closet_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-db

  # ──────────────────────────────────────────────────────
  # REDIS
  # ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: closet-staging-redis
    <<: *restart-policy
    ports:
      - "6379:6379"
    volumes:
      - closet-redisdata:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-cache

  # ──────────────────────────────────────────────────────
  # AI SERVICE (Python / FastAPI)
  # ──────────────────────────────────────────────────────
  closet-ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: closet-staging-ai
    <<: *restart-policy
    ports:
      - "5100:5100"
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: "5100"
      AI_LOG_LEVEL: "INFO"
      AI_UPLOAD_DIR: /app/uploads/temp
      AI_OUTPUT_DIR: /app/uploads/processed
      AI_CORS_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:4000"
      AI_DEBUG: "false"
      TZ: ${TZ:-UTC}
    volumes:
      - closet-shared-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5100/health').status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-ai

  # ──────────────────────────────────────────────────────
  # BACKEND (NestJS)
  # ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: closet-staging-backend
    <<: *restart-policy
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.staging
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-closet_staging}
      DB_USER: ${POSTGRES_USER:-closet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-closet_staging_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "4000"
      AI_SERVICE_URL: http://closet-ai:5100
      TZ: ${TZ:-UTC}
      METRICS_ENABLED: "true"
    volumes:
      - closet-shared-uploads:/app/uploads
      - closet-logs:/var/log/closet
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      closet-ai:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-backend

  # ──────────────────────────────────────────────────────
  # FRONTEND (Next.js)
  # ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: closet-staging-frontend
    <<: *restart-policy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost
      NEXT_PUBLIC_APP_URL: http://localhost
      NEXT_PUBLIC_APP_NAME: "Closet Inteligente (Staging)"
      NEXT_PUBLIC_ENABLE_3D: "false"
      NEXT_PUBLIC_ENABLE_AI_RECOMMENDATIONS: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-web

  # ──────────────────────────────────────────────────────
  # NGINX REVERSE PROXY
  # ──────────────────────────────────────────────────────
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: closet-staging-nginx
    <<: *restart-policy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - closet-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      closet-ai:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    <<: *resources-web

  # ──────────────────────────────────────────────────────
  # PROMETHEUS
  # ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: closet-staging-prometheus
    <<: *restart-policy
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - closet-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ──────────────────────────────────────────────────────
  # GRAFANA
  # ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: closet-staging-grafana
    <<: *restart-policy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - closet-grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ──────────────────────────────────────────────────────
  # OPENTELEMETRY COLLECTOR
  # ──────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: closet-staging-otel
    <<: *restart-policy
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infrastructure/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:4317"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - closet-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
